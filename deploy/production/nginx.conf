# Only this virtual host belongs to ctrl-mesh. Existing sites stay separate.
server {
    listen 80;
    listen [::]:80;
    server_name 1mesh.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/ctrl-mesh/acme; }
    location / { return 308 https://1mesh.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 1mesh.xyz;
    ssl_certificate /etc/letsencrypt/live/1mesh.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1mesh.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/ctrl-mesh/cloudflare-realip.conf;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/ctrl-mesh-access.log;
    error_log /var/log/nginx/ctrl-mesh-error.log;
    # SDK/browser failover recognizes temporary HTTP status codes from JSON.
    # Application errors already return JSON and retain their own response.
    error_page 502 503 504 = @ctrl_mesh_unavailable;
    location @ctrl_mesh_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 2 always;
        return 503 '{"error":"Relay temporarily unavailable. Retry shortly."}';
    }

    # Consensus and journal export between peers are loopback-only.
    location ~ ^/(relays/[abc]/)?api/(ha/|federation/batch) { return 404; }
    location = /relays/a { return 308 /relays/a/; }
    location = /relays/b { return 308 /relays/b/; }
    location = /relays/c { return 308 /relays/c/; }
    location /relays/a/ { include /etc/ctrl-mesh/proxy.conf; proxy_pass http://127.0.0.1:4173/; }
    location /relays/b/ { include /etc/ctrl-mesh/proxy.conf; proxy_pass http://127.0.0.1:4174/; }
    location /relays/c/ { include /etc/ctrl-mesh/proxy.conf; proxy_pass http://127.0.0.1:4175/; }
    location / { include /etc/ctrl-mesh/proxy.conf; proxy_pass http://127.0.0.1:4180; }
}
